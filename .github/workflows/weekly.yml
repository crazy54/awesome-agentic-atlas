# Weekly: everything the daily job skips. Screenshots, the two workbooks, and a dated release.
#
# The split exists because the pipeline has one expensive stage and fifteen cheap ones. Capturing a
# thumbnail per repo with headless Chromium is the expensive one, and it is also the one that almost
# never needs redoing -- a repo's README banner is the same banner it had last Sunday. So the daily job
# leaves the shot cache alone and lets new arrivals show their Open Graph card, and this job, once a
# week, goes and gets the real image and rebuilds the workbooks on top of it.
#
# Unlike the daily job this one is not gated on the source lists having moved. Stars move every day even
# when no list does, and the workbook is a download with a date on it -- a week-old one that claims to be
# current is worse than no release.
name: Weekly — screenshots & workbooks

on:
  schedule:
    # Sundays, 12:40 UTC -- an hour and a half after the daily run, so the two are not queued behind each
    # other on the shared concurrency group even on a day when the daily build has a lot to do.
    - cron: "40 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Shared with daily.yml. Both write `cache/` and push to the same branch; running both at once would race
# on the first-seen ledger and then lose one of the two pushes.
concurrency:
  group: atlas-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold shot cache is the worst case and it is genuinely long. 350 rather than the 360 ceiling, so the
    # job's own timeout fires and the log says what it was doing instead of the runner being cut off.
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip openpyxl pillow playwright

      # See daily.yml: declaring this in `env:` would set it to "" whenever the secret is absent, and an
      # empty CF_BEACON_TOKEN is how you turn the beacon off.
      - name: Honour a CF_BEACON_TOKEN override if one is set
        env:
          OVERRIDE: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "CF_BEACON_TOKEN=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using the CF_BEACON_TOKEN override."
          else
            echo "No override set; using the token committed in scripts/19_pages.py."
          fi

      # See daily.yml for the argument, which is the same one: for both of these "" is not "unset", so
      # neither can be declared in `env:`. This workflow is the one that matters for INDEXNOW_KEY, because
      # `20_landing.py` -- which writes the key file the endpoint fetches -- runs only here. An override set
      # here and not in daily.yml would publish one key and submit another.
      #
      # No `if:` on this step or on the IndexNow step at the foot of this file. This workflow has no gate,
      # so `steps.gate.outputs.go` would evaluate to '' and every gated step would be skipped for ever.
      - name: Honour the search-engine token overrides if they are set
        env:
          VERIFY: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}
          INDEXNOW: ${{ vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$VERIFY" ]; then
            echo "GOOGLE_SITE_VERIFICATION=$VERIFY" >> "$GITHUB_ENV"
            echo "Using the GOOGLE_SITE_VERIFICATION override; index.html will carry the meta tag."
          else
            echo "No GOOGLE_SITE_VERIFICATION set. The Search Console tag is omitted and the property is unverified -- see JFH-206."
          fi
          if [ -n "$INDEXNOW" ]; then
            echo "INDEXNOW_KEY=$INDEXNOW" >> "$GITHUB_ENV"
            echo "Using the INDEXNOW_KEY override. It must match daily.yml's, which submits against the key file this job writes."
          else
            echo "No override set; using the IndexNow key committed in scripts/19_pages.py."
          fi

      # `chrome.py` looks for a Playwright cache before it looks on PATH, so installing it this way is all
      # the two capture stages need -- neither imports playwright, they shell out to the binary. --with-deps
      # pulls the shared libraries a headless Chromium needs that the runner image does not ship.
      - name: Install headless Chromium
        run: playwright install --with-deps chromium

      - name: Show which browser was found
        run: python scripts/chrome.py

      # Same rolling cache as the daily job, same prefix, so the two hand the shot cache back and forth.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}
          restore-keys: atlas-cache-

      - name: Fetch and classify
        run: |
          set -euo pipefail
          mkdir -p cache
          # Unlike the daily job this one is not gated on the lists having moved, so it is also the run
          # that repairs a cache that came back partially restored: pull_sources re-pulls any list whose
          # cached content has gone missing even when its commit id still matches.
          python scripts/pull_sources.py
          python scripts/01_parse.py
          python scripts/02_fetch.py --force
          # Deliberately no --force on the three signal stages -- see daily.yml. This job is the
          # natural home for a weekly full re-crawl of them and it is the one place that must not
          # acquire one: they refresh on `pushedAt` now, so a --force here would re-query all 1,294
          # repos to confirm answers the six daily runs before it already refreshed.
          python scripts/03_releases.py
          python scripts/03b_actions.py
          python scripts/04_classify.py
          python scripts/10_parse_sources.py
          python scripts/11_fetch_all.py
          python scripts/13_signals_all.py
          python scripts/14_classify_all.py

      # The four stages the daily job never runs. Each one skips what it already has, so a warm cache makes
      # this minutes rather than hours -- the work is proportional to new arrivals, not to the atlas.
      #
      # 15_shots_all also drains `cache/collect-queue.json` here. That queue is how a *changed* listing
      # gets a fresh image at all: a key already in shots_all.json is otherwise never rebuilt, which is
      # the right rule for a banner that has not moved and the wrong one for an entry the list rewrote.
      # The daily job fills the queue and never captures, so this is the only run that empties it.
      - name: Capture screenshots
        run: |
          set -euo pipefail
          python scripts/05_shots.py
          python scripts/06_web_shots.py
          python scripts/15_shots_all.py
          python scripts/15b_shots_sources.py

      - name: Build the workbooks
        run: python scripts/16_build_all.py

      - name: Rebuild the Markdown edition and the site
        run: |
          set -euo pipefail
          # See daily.yml: the marker is what the assertion below compares every tracked file against.
          touch "$RUNNER_TEMP/build-start"
          python scripts/17_markdown.py
          # See daily.yml for what this catches and why none of it would fail the build on its own. Both
          # workflows write mega-list/ and both commit it, so a check in only one of them leaves the other
          # free to publish exactly what it rejects.
          python scripts/check_markdown.py
          python scripts/19_pages.py
          # Straight after 19_pages, which rewrote data.json, and before every stage below that reads it
          # -- the position its own docstring asks for. It appends two columns, `d7` and `d30`, plus a
          # `velocity` block, and it is the one stage here that appends to a file instead of regenerating
          # it: `state/star-history.json` is a permanent roster and one sample per week, for ever.
          #
          # Appending to `cols` rather than inserting is what makes this safe to put ahead of the four
          # readers below. Every one of them resolves by name -- 20_landing and 22_detail through
          # `dict(zip(data["cols"], r))`, 21_feeds through `cols.index(...)`, and 22_detail's own
          # client-side script through `d.cols.indexOf(...)` -- so a column arriving at the end is a key
          # they never ask for. 24_pwa does not read data.json at all and does not precache it.
          #
          # Also in daily.yml, and see there for why that is not a duplicate: `record()` enforces the
          # seven-day grid itself, so the daily run re-derives the columns without adding a sample.
          python scripts/25_velocity.py
          # 20 and 21 must both follow 19_pages and never precede it: that stage is what stamps the
          # ledger and rewrites data.json, and both of these read data.json and nothing else. Run first,
          # the feeds would publish yesterday's arrivals and the landing pages would prerender
          # yesterday's rows.
          python scripts/20_landing.py
          python scripts/21_feeds.py
          # Both of these are weekly-only for the same reason 20_landing is -- see daily.yml. 22_detail
          # reads data.json and nothing else, so its only ordering constraint is to follow 19_pages.
          python scripts/22_detail.py
          # After 20_landing, and not merely near it: that stage writes the og:image tags, this one writes
          # the files they point at, and the two are one change. A run that emitted the tags without the
          # cards would publish 156 pages referencing images that are not there.
          python scripts/23_og.py
          # Last, because the service worker's version is a hash of the files it precaches -- `index.html`
          # from 19_pages and `pages.css` from 20_landing -- so it has to see both in their final state.
          # It does not have to trust the ordering: the stage exits with a message if either is missing.
          python scripts/24_pwa.py

      # The same assertion daily.yml carries -- see there for why it is mtime against a marker rather than
      # a manifest, and why an unwritten facet page is a warning while an unwritten fixed path is an error.
      #
      # Deliberately with no `if:` -- this workflow has no gate, every step runs, and copying daily.yml's
      # `if: steps.gate.outputs.go == 'true'` here would reference a step that does not exist in this
      # file. That expression would evaluate to false on every run and silently skip the check for ever,
      # which is a worse failure than the one being guarded against: a green tick that checked nothing.
      - name: Every tracked page was rewritten
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/frozen"
          : > "$RUNNER_TEMP/prunable"
          git ls-files docs mega-list | while IFS= read -r f; do
            if [ "$f" -nt "$RUNNER_TEMP/build-start" ]; then continue; fi
            case "$f" in
              # `docs/og/*.png` and not `docs/og/*`: a card whose content did not change is deliberately
              # not rewritten -- that skip is the whole reason the cards cost ~84 KB a week instead of
              # 527 -- so an unwritten PNG is expected. `cards.json` is written unconditionally, so it
              # stays under the strict arm below and still proves the stage ran at all.
              #
              # `docs/repo/*/*` and not `docs/repo/*`: the per-repo pages are data-derived and prunable,
              # but `docs/repo/index.html`, `detail.css` and `detail.js` are fixed paths. `*` matches `/`
              # in a case pattern, so the broader glob would have swallowed all three and left that stage
              # with nothing under the strict arm -- exactly the hole the comment in daily.yml warns about.
              mega-list/topics/*|mega-list/targets/*|mega-list/lists/*|mega-list/platforms/*|docs/topic/*|docs/target/*|docs/og/*.png|docs/repo/*/*)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/prunable" ;;
              *)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/frozen" ;;
            esac
          done
          np="$(wc -l < "$RUNNER_TEMP/prunable" | tr -d ' ')"
          nf="$(wc -l < "$RUNNER_TEMP/frozen" | tr -d ' ')"
          if [ "$np" -gt 0 ]; then
            echo "Facet pages that are tracked but no longer emitted:"
            sed 's/^/  /' "$RUNNER_TEMP/prunable"
            echo "::warning title=Orphaned facet page::${np} tracked facet page(s) were not written by this build. If a topic, target, source list or platform was dropped or renamed, this is correct and the fix is to \`git rm\` them in the commit that changed the taxonomy -- they are stale from now on, and their URLs are indexed. If no facet was dropped or renamed, this is not a prune: a generator is missing from this workflow and the build is wrong."
          fi
          if [ "$nf" -gt 0 ]; then
            echo "Tracked files that no generator wrote:"
            sed 's/^/  /' "$RUNNER_TEMP/frozen"
            echo "::error title=Generator missing from the build::${nf} tracked file(s) under docs/ or mega-list/ are committed but were not written. These have fixed paths, so no taxonomy change can explain them: the stage that writes them is missing from this workflow, and the published copy can never change again until it is put back."
            exit 1
          fi
          echo "All $(git ls-files docs mega-list | wc -l | tr -d ' ') tracked files under docs/ and mega-list/ were rewritten by this build."

      - name: Record the source commits as built
        run: python scripts/watch_sources.py --update

      # The workbooks are release assets, not repository files -- .gitignore already excludes them. Only
      # the three generated surfaces get committed, and that commit is what redeploys Pages.
      - name: Commit and push the site and Markdown
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mega-list state
          if git diff --cached --quiet; then
            echo "Nothing changed in docs/, mega-list/ or state/."
          else
            # Before the commit, which is the only moment `--cached` is the delta about to be published.
            # See daily.yml for the reasoning and for why `--no-renames`. This is the list that matters:
            # this job is the one that rewrites the 156 facet pages and the 1,294 detail pages, so a week's
            # worth of new and changed URLs is submitted from here and a day's from there.
            git diff --cached --name-status --no-renames -- docs > "$RUNNER_TEMP/changed-docs.txt"
            git commit -m "Weekly rebuild $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # After the push, so the URLs are live before an engine is told to fetch them, and before the release
      # step so a failure publishing the workbooks cannot silently cost the submission. Deliberately no
      # `if:` -- see the note on the token step above. A non-2xx here is a warning and exit 0; the file is
      # absent when nothing was committed, which the script reads as "nothing changed".
      - name: Tell IndexNow which URLs changed
        run: python scripts/26_indexnow.py --changed "$RUNNER_TEMP/changed-docs.txt"

      # A dated tag, and `--latest` on every one of them, because the README links to
      # `releases/latest/download/Awesome-Agentic-Atlas-DARK.xlsx` -- a permanent URL that resolves to
      # whatever is newest. `--clobber` on the fallback path so re-running this workflow the same day
      # replaces the assets instead of failing on a tag that already exists.
      #
      # Size note: LIGHT used to come out near 48 MB from here against about 16 MB for DARK, and the
      # difference was never the theme -- the smaller LIGHT that had been published by hand went through
      # an Excel COM round-trip, which re-deduplicates embedded media and cannot run on a Linux runner.
      # `scripts/media.py` does that deduplication in the build now, so both files should land in the
      # same size range; the build's own log line prints the placement and entry counts if they do not.
      - name: Publish the workbooks as a release
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)"
          summary="$(python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("docs/data.json").read_text(encoding="utf-8"))
          print(f"{len(d['rows']):,} projects across {len(d['cats'])} topics · snapshot {d['snapshot']}")
          PY
          )"
          notes="${summary}

          Two workbooks, same data, different theme. Pick one:

          - \`Awesome-Agentic-Atlas-DARK.xlsx\`
          - \`Awesome-Agentic-Atlas-LIGHT.xlsx\`

          Also published: the [site](https://crazy54.github.io/awesome-agentic-atlas/) and the Markdown
          edition in \`mega-list/\`, both rebuilt from this same snapshot.

          Built by \`.github/workflows/weekly.yml\` (run ${{ github.run_id }})."

          files=(Awesome-Agentic-Atlas-DARK.xlsx Awesome-Agentic-Atlas-LIGHT.xlsx)
          ls -lh "${files[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --latest --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" \
              --title "Awesome Agentic Atlas $tag" --notes "$notes" --latest
          fi
