# Weekly: everything the daily job skips. Screenshots, the two workbooks, and a dated release.
#
# The split exists because the pipeline has one expensive stage and fifteen cheap ones. Capturing a
# thumbnail per repo with headless Chromium is the expensive one, and it is also the one that almost
# never needs redoing -- a repo's README banner is the same banner it had last Sunday. So the daily job
# leaves the shot cache alone and lets new arrivals show their Open Graph card, and this job, once a
# week, goes and gets the real image and rebuilds the workbooks on top of it.
#
# Unlike the daily job this one is not gated on the source lists having moved. Stars move every day even
# when no list does, and the workbook is a download with a date on it -- a week-old one that claims to be
# current is worse than no release.
name: Weekly — screenshots & workbooks

on:
  schedule:
    # Sundays, 12:40 UTC -- an hour and a half after the daily run, so the two are not queued behind each
    # other on the shared concurrency group even on a day when the daily build has a lot to do.
    - cron: "40 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Shared with daily.yml. Both write `cache/` and push to the same branch; running both at once would race
# on the first-seen ledger and then lose one of the two pushes.
concurrency:
  group: atlas-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold shot cache is the worst case and it is genuinely long. 350 rather than the 360 ceiling, so the
    # job's own timeout fires and the log says what it was doing instead of the runner being cut off.
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # See daily.yml for why numpy is here: one stage, one build-time linear algebra pass.
      - run: python -m pip install --upgrade pip openpyxl pillow playwright numpy

      # See daily.yml: declaring this in `env:` would set it to "" whenever the secret is absent, and an
      # empty CF_BEACON_TOKEN is how you turn the beacon off.
      - name: Honour a CF_BEACON_TOKEN override if one is set
        env:
          OVERRIDE: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "CF_BEACON_TOKEN=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using the CF_BEACON_TOKEN override."
          else
            echo "No override set; using the token committed in scripts/19_pages.py."
          fi

      # See daily.yml for the argument, which is the same one: for both of these "" is not "unset", so
      # neither can be declared in `env:`. This workflow is the one that matters for INDEXNOW_KEY, because
      # `20_landing.py` -- which writes the key file the endpoint fetches -- runs only here.
      #
      # The two workflows cannot disagree about the *value*: both read the same repository-scoped
      # `${{ vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY }}`, so there is one setting and no way to set it in
      # one file and not the other. The hazard is temporal instead, and it is the reason this note is here
      # rather than there. This workflow is the only writer of the key file and it runs weekly, so from the
      # moment somebody sets or rotates the variable until the next weekly run, every daily submission
      # posts a key whose file is not yet published -- a 403 with the documented meaning, on every daily
      # run, for up to a week. Nothing breaks and nothing needs undoing: the next weekly run publishes the
      # file and the URLs are resubmitted by the next build that changes them. Rotate right before a
      # weekly run, or dispatch this workflow by hand afterwards, and the window closes immediately.
      #
      # No `if:` on this step or on the IndexNow step at the foot of this file. This workflow has no gate,
      # so `steps.gate.outputs.go` would evaluate to '' and every gated step would be skipped for ever.
      - name: Honour the search-engine token overrides if they are set
        env:
          VERIFY: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}
          INDEXNOW: ${{ vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$VERIFY" ]; then
            echo "GOOGLE_SITE_VERIFICATION=$VERIFY" >> "$GITHUB_ENV"
            echo "Using the GOOGLE_SITE_VERIFICATION override; index.html will carry the meta tag."
          else
            echo "No GOOGLE_SITE_VERIFICATION set. The Search Console tag is omitted and the property is unverified -- see JFH-206."
          fi
          if [ -n "$INDEXNOW" ]; then
            echo "INDEXNOW_KEY=$INDEXNOW" >> "$GITHUB_ENV"
            echo "Using the INDEXNOW_KEY override. It must match daily.yml's, which submits against the key file this job writes."
          else
            echo "No override set; using the IndexNow key committed in scripts/19_pages.py."
          fi

      # `chrome.py` looks for a Playwright cache before it looks on PATH, so installing it this way is all
      # the two capture stages need -- neither imports playwright, they shell out to the binary. --with-deps
      # pulls the shared libraries a headless Chromium needs that the runner image does not ship.
      - name: Install headless Chromium
        run: playwright install --with-deps chromium

      - name: Show which browser was found
        run: python scripts/chrome.py

      # Same rolling cache as the daily job, same prefix, so the two hand the shot cache back and forth.
      #
      # Deliberately restore/save as two steps rather than one `actions/cache`. That action saves in a post
      # step that runs *only when the job succeeded*, which for a six-hour job is the wrong rule: it means a
      # run that captures 6,000 screenshots and then dies on the 6,001st throws all six thousand away, and
      # the next attempt starts cold and dies in the same place. Every stage past the parser skips what it
      # already has, so a partial cache is worth strictly more than no cache. The save below is
      # `if: always()`, so a failed *or* timed-out run banks its progress and the retry resumes.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}
          restore-keys: atlas-cache-

      - name: Fetch and classify
        run: |
          set -euo pipefail
          mkdir -p cache
          # Unlike the daily job this one is not gated on the lists having moved, so it is also the run
          # that repairs a cache that came back partially restored: pull_sources re-pulls any list whose
          # cached content has gone missing even when its commit id still matches.
          python scripts/pull_sources.py
          python scripts/01_parse.py
          python scripts/02_fetch.py --force
          # Deliberately no --force on the three signal stages -- see daily.yml. This job is the
          # natural home for a weekly full re-crawl of them and it is the one place that must not
          # acquire one: they refresh on `pushedAt` now, so a --force here would re-query all 1,294
          # repos to confirm answers the six daily runs before it already refreshed.
          python scripts/03_releases.py
          python scripts/03b_actions.py
          python scripts/04_classify.py
          python scripts/10_parse_sources.py
          python scripts/11_fetch_all.py
          python scripts/13_signals_all.py
          python scripts/14_classify_all.py

      # The four stages the daily job never runs. Each one skips what it already has, so a warm cache makes
      # this minutes rather than hours -- the work is proportional to new arrivals, not to the atlas.
      #
      # 15_shots_all also drains `cache/collect-queue.json` here. That queue is how a *changed* listing
      # gets a fresh image at all: a key already in shots_all.json is otherwise never rebuilt, which is
      # the right rule for a banner that has not moved and the wrong one for an entry the list rewrote.
      # The daily job fills the queue and never captures, so this is the only run that empties it.
      - name: Capture screenshots
        run: |
          set -euo pipefail
          python scripts/05_shots.py
          python scripts/06_web_shots.py
          python scripts/15_shots_all.py
          python scripts/15b_shots_sources.py

      - name: Build the workbooks
        run: python scripts/16_build_all.py

      - name: Rebuild the Markdown edition and the site
        run: |
          set -euo pipefail
          # See daily.yml: the marker is what the assertion below compares every tracked file against.
          touch "$RUNNER_TEMP/build-start"
          python scripts/17_markdown.py
          # See daily.yml for what this catches and why none of it would fail the build on its own. Both
          # workflows write mega-list/ and both commit it, so a check in only one of them leaves the other
          # free to publish exactly what it rejects.
          python scripts/check_markdown.py
          python scripts/19_pages.py
          # Straight after 19_pages, which rewrote data.json, and before every stage below that reads it
          # -- the position its own docstring asks for. It appends two columns, `d7` and `d30`, plus a
          # `velocity` block, and it is the one stage here that appends to a file instead of regenerating
          # it: `state/star-history.json` is a permanent roster and one sample per week, for ever.
          #
          # Appending to `cols` rather than inserting is what makes this safe to put ahead of the four
          # readers below. Every one of them resolves by name -- 20_landing and 22_detail through
          # `dict(zip(data["cols"], r))`, 21_feeds through `cols.index(...)`, and 22_detail's own
          # client-side script through `d.cols.indexOf(...)` -- so a column arriving at the end is a key
          # they never ask for. 24_pwa does not read data.json at all and does not precache it.
          #
          # Also in daily.yml, and see there for why that is not a duplicate: `record()` enforces the
          # seven-day grid itself, so the daily run re-derives the columns without adding a sample.
          python scripts/25_velocity.py
          # After every stage that writes data.json -- 19_pages, which rewrites it, and 25_velocity, which
          # patches it -- because docs/live.json is a projection of three of its columns and has to be a
          # projection of the copy that ships, not of an earlier one. Nothing downstream reads live.json,
          # so this is its only ordering constraint, and it is the reason this line sits here and not one
          # line up. `set -euo pipefail` is what makes the ordering an invariant rather than a hope: this
          # stage exits if the dataset it reads is absent, so either it reads the file those two just
          # wrote or the job fails.
          #
          # Not part of 22_detail.py, and that is the whole design decision -- JFH-222 originally asked
          # for the opposite. The pages 22_detail writes hold no volatile number precisely so that they
          # are byte-identical week to week; this file is the volatile numbers, and it has to be rebuilt
          # every time data.json is. Emitting it from a weekly stage would peg the star counts on 1,294
          # detail pages to the weekly run while the index and the 156 facet pages moved nightly, and
          # publish two different star counts for one repository for up to six days. So it is here *and*
          # in daily.yml -- and if it is ever dropped from daily.yml that is exactly what happens, with
          # no error anywhere, which is why tests/live_test.py asserts it appears in both.
          python scripts/19c_live.py
          # Discover: `docs/discover.json` and `docs/discover/index.html`. One invocation, in both workflows,
          # and the stage decides which of its two jobs it is doing -- a run whose published plan already
          # reaches today re-renders that plan against fresh rows and leaves the rotation ledger alone; a run
          # whose plan does not reach today picks a fresh week and stamps `state/discover.json`. On Sundays
          # this job is the second case and the nightly is the first, which is the whole design, and it is
          # expressed as one command precisely so that the two cannot be given different flags and drift.
          #
          # Both workflows for the reason 19c_live is in both, and one stronger. A plan covers seven dated
          # cohorts and the page shows the one dated today: weekly-only would mean six nights out of seven
          # where the strip and the page carry names, stars and blurbs from last Sunday's data.json, and
          # where a project that left the atlas on Tuesday keeps a card linking to a detail page no build
          # wrote. Drop it from daily.yml and there is no error anywhere -- so tests/discover_test.py
          # asserts it appears in both, exactly as live_test.py does for the sidecar above.
          #
          # After 19_pages because it reads the `docs/data.json` that stage rewrites, and before 20_landing
          # because that stage imports this one's `urls()` into `docs/sitemap.xml`: run the other way round,
          # the sitemap would name `discover/` on the first build and the directory would not be there yet,
          # which `tests/indexnow_test.py` fails in both directions on purpose.
          python scripts/19d_discover.py
          # 20 and 21 must both follow 19_pages and never precede it: that stage is what stamps the
          # ledger and rewrites data.json, and both of these read data.json and nothing else. Run first,
          # the feeds would publish yesterday's arrivals and the landing pages would prerender
          # yesterday's rows.
          python scripts/20_landing.py
          python scripts/21_feeds.py
          # Both of these are weekly-only for the same reason 20_landing is -- see daily.yml. 22_detail
          # reads data.json and nothing else, so its only ordering constraint is to follow 19_pages.
          python scripts/22_detail.py
          # The curated collections, and their absence from this list is what cost run 35613799572 its
          # deploy: `25_collections.py` writes thirteen fixed paths -- `docs/collections/index.html`, five
          # `docs/collections/<slug>/index.html`, and their seven Markdown twins under
          # `mega-list/collections/` -- and no other stage writes any of them. The assertion below is
          # exactly the check for that, and it had never had the chance to say so, because every weekly run
          # since the stage landed in 18d373a died earlier. Seven consecutive failures, none of them here.
          #
          # After 19_pages for the ordinary reason -- it reads `docs/data.json` and nothing else, no cache
          # and no network -- and before 24_pwa because its own docstring asks for that in as many words:
          # the worker's version is a hash of what it precaches, so a collection page rewritten after the
          # worker is stamped is a page returning readers keep the old copy of.
          #
          # This is also the one stage in the list that can redden a green ingest on purpose. A pick names
          # a repository and states a claim about it -- "runs on Windows, and says so" is a page whose
          # value is that the verdict is `Y` and not `L` -- and `check()` fails the build rather than
          # publish the page with a weaker claim than its prose makes. A rename it survives, via `aka`. A
          # verdict that drops under a fresh ingest it does not, by design: the fix is a curator editing
          # `config/collections.json`, not a quieter stage.
          python scripts/25_collections.py
          # After 20_landing, and not merely near it: that stage writes the og:image tags, this one writes
          # the files they point at, and the two are one change. A run that emitted the tags without the
          # cards would publish 156 pages referencing images that are not there.
          python scripts/23_og.py
          # The homepage, in the same slot daily.yml runs it in and for the same three reads -- see the
          # longer note there. `docs/index.html` is the shelves page now; `19_pages.py` above writes
          # `docs/catalog/index.html`. Its inputs are `docs/discover.json` (19d_discover),
          # `docs/pages.css` (20_landing) and `docs/data.json` (19_pages, patched by 25_velocity), and its
          # one downstream constraint is the stage on the next line.
          python scripts/31_home.py
          # Last, because the service worker's version is a hash of the files it precaches -- `index.html`
          # from 31_home and `pages.css` from 20_landing -- so it has to see both in their final state.
          # It does not have to trust the ordering: the stage exits with a message if either is missing.
          python scripts/24_pwa.py
          # The semantic index (JFH-293). See daily.yml for the whole argument about this position -- in
          # short, it has to follow the two stages that write `docs/data.json` because it fingerprints
          # that file, nothing reads what it writes, and it is the only stage here that needs the network,
          # so it goes where a failure leaves the site consistent rather than half-stamped.
          #
          # In this job for the same reason 19_pages is: this workflow rewrites `docs/data.json` too, and
          # an index built against a different row set does not degrade, it reads each project's
          # neighbour. The fingerprint means a reader gets no answer instead of the wrong one, but "no
          # answer" is still the feature gone -- so it is rebuilt wherever the corpus is.
          python scripts/27_semantic.py

      # The same assertion daily.yml carries -- see there for why it is mtime against a marker rather than
      # a manifest, and why an unwritten facet page is a warning while an unwritten fixed path is an error.
      #
      # Deliberately with no `if:` -- this workflow has no gate, every step runs, and copying daily.yml's
      # `if: steps.gate.outputs.go == 'true'` here would reference a step that does not exist in this
      # file. That expression would evaluate to false on every run and silently skip the check for ever,
      # which is a worse failure than the one being guarded against: a green tick that checked nothing.
      - name: Every tracked page was rewritten
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/frozen"
          : > "$RUNNER_TEMP/prunable"
          : > "$RUNNER_TEMP/deleted"
          : > "$RUNNER_TEMP/static"
          : > "$RUNNER_TEMP/beta"
          git ls-files docs mega-list | while IFS= read -r f; do
            # Existence before mtime, and that order is the whole of this arm. `git ls-files` reads the
            # *index*, so a file a generator deliberately deleted from the working tree is still listed
            # here -- and `-nt` against a path that does not exist is false, so it would fall through the
            # mtime skip and be sorted by name like a file that is merely stale. Nothing about a name can
            # tell those two apart, which is why this is not another `case` pattern: a deleted file and an
            # unwritten one are opposite findings that happen to look identical from `ls-files`.
            #
            # A deletion here is intended by construction. `20_landing.prune` removes facet pages whose
            # facet stopped existing and `20_landing.prune_keys` removes the key file from a rotated
            # `INDEXNOW_KEY`; both are prunes, and the `git add docs mega-list` in the commit step stages
            # the removal, so the repository self-heals in this same run with no `git rm` from anybody.
            # That is the difference from the prunable arm below, where the file is still present, still
            # served and still needs a human. Reported, not warned about: on a key rotation this fires
            # exactly once and is the correct outcome, and a warning that is right every time it appears
            # is a warning people learn to scroll past.
            if [ ! -e "$f" ]; then printf '%s\n' "$f" >> "$RUNNER_TEMP/deleted"; continue; fi
            if [ "$f" -nt "$RUNNER_TEMP/build-start" ]; then continue; fi
            case "$f" in
              # Three files under `docs/` are checked in by hand and no generator has ever written them:
              # the custom domain, the site icon and the mascot. Every stage that mentions them *reads*
              # them -- `19_pages` and `22_detail` link `favicon.svg`, `16_build_all` embeds the mascot in
              # the workbooks -- so "not rewritten" is their steady state rather than a missing stage, and
              # the strict arm below was calling all three an error. It is deliberately this list and not
              # `docs/*.png` or a blanket `docs/assets/*`: `apple-touch-icon.png` and the three `icon-*`
              # PNGs sit beside them and *are* generated, so a wider pattern would stop 24_pwa's output
              # being checked at all -- the exact hole the note above about `docs/repo/*` describes.
              #
              # Listed rather than silently skipped, because the honest reading of a growing list here is
              # that somebody is hand-maintaining published files, which is worth seeing on a green run.
              docs/CNAME|docs/favicon.svg|docs/assets/atlas-byte.png)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/static" ;;
              # `docs/v2/*` is the redesign beta, and it is the one place where a generator exists and is
              # deliberately *not* wired into this workflow. `scripts/30_v2.py` writes all 505 of these
              # files, from `docs/data.json` alone, on demand -- so the strict arm's diagnosis ("the stage
              # that writes them is missing") is precisely wrong here, and its remedy of adding a stage
              # would rebuild a beta surface on every scheduled run and commit the churn.
              #
              # Its own arm rather than the `static` list above, for two reasons. The prose there says "no
              # generator owns them", which would be a false statement about 505 files; and that arm prints
              # every path it collects, which on a green run would bury the summary under 505 lines. This
              # one reports a count and the command that refreshes it.
              #
              # `docs/v2/*` and not `docs/v2/*/*`: `*` matches `/` in a `case` pattern, so this covers the
              # six mode pages and every `docs/v2/repo/<owner>/<name>.html` beneath them in one pattern.
              # Nothing under `docs/v2/` has a generator in this workflow, so unlike `docs/repo/*/*` there
              # is no fixed-path file here that needs to stay under the strict arm.
              docs/v2/*)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/beta" ;;
              # `docs/og/*.png` and not `docs/og/*`: a card whose content did not change is deliberately
              # not rewritten -- that skip is the whole reason the cards cost ~84 KB a week instead of
              # 527 -- so an unwritten PNG is expected. `cards.json` is written unconditionally, so it
              # stays under the strict arm below and still proves the stage ran at all.
              #
              # `docs/repo/*/*` and not `docs/repo/*`: the per-repo pages are data-derived and prunable,
              # but `docs/repo/index.html`, `detail.css` and `detail.js` are fixed paths. `*` matches `/`
              # in a case pattern, so the broader glob would have swallowed all three and left that stage
              # with nothing under the strict arm -- exactly the hole the comment in daily.yml warns about.
              mega-list/topics/*|mega-list/targets/*|mega-list/lists/*|mega-list/platforms/*|docs/topic/*|docs/target/*|docs/og/*.png|docs/repo/*/*)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/prunable" ;;
              *)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/frozen" ;;
            esac
          done
          np="$(wc -l < "$RUNNER_TEMP/prunable" | tr -d ' ')"
          nf="$(wc -l < "$RUNNER_TEMP/frozen" | tr -d ' ')"
          nd="$(wc -l < "$RUNNER_TEMP/deleted" | tr -d ' ')"
          nst="$(wc -l < "$RUNNER_TEMP/static" | tr -d ' ')"
          nb="$(wc -l < "$RUNNER_TEMP/beta" | tr -d ' ')"
          if [ "$nst" -gt 0 ]; then
            echo "Hand-maintained files no generator owns, left as they are:"
            sed 's/^/  /' "$RUNNER_TEMP/static"
          fi
          if [ "$nb" -gt 0 ]; then
            echo "Redesign beta under docs/v2/, owned by scripts/30_v2.py and rebuilt on demand: ${nb} file(s)."
          fi
          if [ "$nd" -gt 0 ]; then
            echo "Tracked files this build deleted, whose removal the commit below carries:"
            sed 's/^/  /' "$RUNNER_TEMP/deleted"
          fi
          if [ "$np" -gt 0 ]; then
            echo "Facet pages that are tracked but no longer emitted:"
            sed 's/^/  /' "$RUNNER_TEMP/prunable"
            echo "::warning title=Orphaned facet page::${np} tracked facet page(s) were not written by this build. If a topic, target, source list or platform was dropped or renamed, this is correct and the fix is to \`git rm\` them in the commit that changed the taxonomy -- they are stale from now on, and their URLs are indexed. If no facet was dropped or renamed, this is not a prune: a generator is missing from this workflow and the build is wrong."
          fi
          if [ "$nf" -gt 0 ]; then
            echo "Tracked files that no generator wrote:"
            sed 's/^/  /' "$RUNNER_TEMP/frozen"
            echo "::error title=Generator missing from the build::${nf} tracked file(s) under docs/ or mega-list/ are committed but were not written. These have fixed paths, so no taxonomy change can explain them: the stage that writes them is missing from this workflow, and the published copy can never change again until it is put back."
            exit 1
          fi
          echo "All $(git ls-files docs mega-list | wc -l | tr -d ' ') tracked files under docs/ and mega-list/ were rewritten by this build, or deleted by it ($nd), or are hand-maintained ($nst), or are the docs/v2/ beta ($nb)."

      - name: Record the source commits as built
        run: python scripts/watch_sources.py --update

      # Runs on success, on failure and on the 350-minute timeout, because the whole point is to bank
      # progress a broken run made. It is the last word on `cache/`, so it sits after every stage that
      # writes there.
      #
      # The sweep first: every checkpointed file is written non-atomically, so a process killed mid-write
      # leaves truncated JSON, and caching that would hand the *next* run a file that exists and cannot be
      # parsed -- turning one failed run into every future run failing earlier. Deleting an unparseable
      # file costs only the work it recorded; every reader already treats an absent cache file as empty.
      #
      # continue-on-error because banking the cache must never be what fails a build that otherwise
      # worked -- notably on a re-run, where the run_id key already exists and the upload is rejected.
      - name: Bank the build cache, even if this run failed
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("cache").glob("*.json")):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::warning title=Dropped a truncated cache file::{p} did not parse "
                        f"({type(exc).__name__}), so it is not being cached: {str(exc)[:120]}")
                  p.unlink()
          PY

      - name: Save build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}

      # The workbooks are release assets, not repository files -- .gitignore already excludes them. Only
      # the three generated surfaces get committed, and that commit is what redeploys Pages.
      - name: Commit and push the site and Markdown
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mega-list state
          if git diff --cached --quiet; then
            echo "Nothing changed in docs/, mega-list/ or state/."
          else
            # Before the commit, which is the only moment `--cached` is the delta about to be published.
            # See daily.yml for the reasoning and for why `--no-renames`. This is the list that matters:
            # this job is the one that rewrites the 156 facet pages and the 1,294 detail pages, so a week's
            # worth of new and changed URLs is submitted from here and a day's from there.
            git diff --cached --name-status --no-renames -- docs > "$RUNNER_TEMP/changed-docs.txt"
            git commit -m "Weekly rebuild $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # After the push, so the URLs are live before an engine is told to fetch them, and before the release
      # step so a failure publishing the workbooks cannot silently cost the submission. Deliberately no
      # `if:` -- see the note on the token step above. A non-2xx here is a warning and exit 0; the file is
      # absent when nothing was committed, which the script reads as "nothing changed".
      #
      # `continue-on-error` because the ordering that protects the submission from the release also coupled
      # the release to the submission, and that direction is the expensive one. Every step carries an
      # implicit `success()`, so any non-zero exit from the line below -- an unhandled exception in a
      # module whose whole contract is that a bad response is a warning -- would skip the release step and
      # cost a week's workbooks over a ping to Bing. Kept here rather than moved after the release because
      # the argument above is still true and both couplings are now cut: this step cannot fail the job,
      # and nothing after it depends on it. The step still goes red in the run summary, so a fault here is
      # visible; it just is not fatal to a build whose actual job already succeeded.
      - name: Tell IndexNow which URLs changed
        continue-on-error: true
        run: python scripts/26_indexnow.py --changed "$RUNNER_TEMP/changed-docs.txt"

      # A dated tag, and `--latest` on every one of them, because the README links to
      # `releases/latest/download/Awesome-Agentic-Atlas-DARK.xlsx` -- a permanent URL that resolves to
      # whatever is newest. `--clobber` on the fallback path so re-running this workflow the same day
      # replaces the assets instead of failing on a tag that already exists.
      #
      # Size note: LIGHT used to come out near 48 MB from here against about 16 MB for DARK, and the
      # difference was never the theme -- the smaller LIGHT that had been published by hand went through
      # an Excel COM round-trip, which re-deduplicates embedded media and cannot run on a Linux runner.
      # `scripts/media.py` does that deduplication in the build now, so both files should land in the
      # same size range; the build's own log line prints the placement and entry counts if they do not.
      - name: Publish the workbooks as a release
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d)"
          summary="$(python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("docs/data.json").read_text(encoding="utf-8"))
          print(f"{len(d['rows']):,} projects across {len(d['cats'])} topics · snapshot {d['snapshot']}")
          PY
          )"
          notes="${summary}

          Two workbooks, same data, different theme. Pick one:

          - \`Awesome-Agentic-Atlas-DARK.xlsx\`
          - \`Awesome-Agentic-Atlas-LIGHT.xlsx\`

          Also published: the [site](https://aaa.jeremyfhall.com/) and the Markdown
          edition in \`mega-list/\`, both rebuilt from this same snapshot.

          Built by \`.github/workflows/weekly.yml\` (run ${{ github.run_id }})."

          files=(Awesome-Agentic-Atlas-DARK.xlsx Awesome-Agentic-Atlas-LIGHT.xlsx)
          ls -lh "${files[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --latest --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" \
              --title "Awesome Agentic Atlas $tag" --notes "$notes" --latest
          fi
