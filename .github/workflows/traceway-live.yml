# Post-deploy check: loads the live homepage in headless Chrome and passes when its configuration fetch and
# its first report both return 200. It writes, commits and deploys nothing. Runs after each Pages build and
# daily at 18:25 UTC; six attempts 30 s apart cover a CDN that has not caught up.
name: Monitoring live check

on:
  page_build:
  schedule:
    - cron: "25 18 * * *"
  workflow_dispatch:

# It reads the tree for the script and reports through the check itself.
permissions:
  contents: read

# One at a time. Two deploys in quick succession leave one interesting answer, the newest one.
concurrency:
  group: traceway-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    # Six attempts of up to 60 s with 30 s between them is about nine minutes, plus Chrome's start.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reports from the live site
        env:
          TRACEWAY_CHECK_ATTEMPTS: "6"
        run: node scripts/check-traceway-live.mjs https://aaa.jeremyfhall.com/
