# Daily: notice what the 39 source lists added, and republish the site and the Markdown edition.
#
# What this job does NOT do is capture screenshots or build the workbooks. Screenshots are the only
# genuinely expensive stage -- 3,462 headless renders on a cold cache when the atlas was 1,294 repos,
# so upward of 20,000 at the 7,980 it holds now -- and both the site and the Markdown fall back to
# GitHub's Open Graph card for any repo without one, which 608 of the 1,294 rows already did when that
# was measured, and a larger share until `weekly.yml` has caught up with the lists added since. So a
# brand-new project shows its card here within a day and gets a real screenshot when `weekly.yml` next
# runs. Metadata is not deferred that way: stars and last-push are refetched in full every run, because
# a snapshot date that advanced while the numbers underneath it stood still would be a lie told daily.
#
# Pages needs no deploy step. This repository serves Pages from the branch's `docs/` folder, so the
# commit at the end of this job *is* the deployment -- GitHub's own pages-build-deployment run picks it
# up. Nothing here has to be told the site's URL.
#
# Which is also why the thirteen-harness suite runs here, between the generators and that commit, rather
# than only in `tests.yml`: this job pushes with `secrets.GITHUB_TOKEN`, GitHub starts no workflow runs for
# such a push, and so none of this job's ~30 commits a month has ever triggered a check. See the
# verification block before the commit step, and `VERIFY_GATES_DEPLOY` in `env:` for whether a red suite
# stops the deploy or merely reddens the run.
name: Daily — site & Markdown

on:
  schedule:
    # 11:12 UTC. Actions cron is UTC only and never shifts for daylight saving, so this is 07:12 in New
    # York in summer and 06:12 in winter. Twelve past the hour rather than on it: the top of every hour
    # is when every cron on GitHub fires at once and scheduled runs get queued behind it.
    - cron: "12 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no source list has moved
        type: boolean
        default: false

# The build commits docs/, mega-list/ and state/ back to this branch. That push is what redeploys Pages.
permissions:
  contents: write

# One atlas build at a time. The weekly workbook job shares this group on purpose: both write `cache/`
# and both push to the same branch, so two at once would race on the first-seen ledger and then one of
# them would fail to push. `cancel-in-progress: false` because a half-finished build that gets killed
# has already recorded nothing -- letting it finish is cheaper than the retry.
concurrency:
  group: atlas-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 90 was set when the atlas was 1,294 repos and it no longer fits. The network stages alone measure out
    # at around eighty minutes at the 7,870 distinct repos the source lists now resolve to -- see the token
    # note below for the breakdown -- before pip, the cache restore, the generators and the push. A run cut
    # off at the timeout is the quietest possible failure: it commits nothing and records nothing, so the
    # published site simply stops moving and there is no diff anywhere that says why. 180 is about twice the
    # projection, which is the room the atlas needs to double again before this number is what breaks, and
    # still half of weekly.yml's.
    timeout-minutes: 180
    env:
      # Every fetch stage shells out to `gh`, which reads this. The Actions token is enough -- the pipeline
      # only ever reads public repositories -- but the limit it grants, 1,000 requests per hour per repo, is
      # a fifth of what a personal token gets, so what a run spends is worth knowing. Nothing here probes
      # repos one at a time: all five metadata and signal stages batch theirs into a single GraphQL query,
      # twelve to twenty-five at a time, and a batch costs one point however many repos are in it. So the
      # 7,870 come to about 395 points for stars and READMEs and about 660 for the release and Actions
      # signals, plus 32 for the 199 curated entries: call it 1,100 batches, which is the figure the retry
      # ceiling in `02_fetch.py` is sized against -- at one attempt each, a per-batch failure rate as low as
      # a tenth of a percent makes a red build more likely than not. REST is the expensive road and it is
      # taken for two things only: a repo whose README is not
      # literally `README.md` at HEAD, which is 2.8% of them at two requests each, and a repo GitHub cannot
      # resolve at all, which is 3.6% at one 404 each. Call a full cold run 1,200 GraphQL points and 800
      # REST requests.
      #
      # "Cold" is doing real work in that last sentence, because of JFH-211: all three signal stages now
      # queue on `scripts/signals.py`'s rule -- re-query a repo only when its `pushedAt` has moved since its
      # cache entry was written -- so those ~660 signal batches are the ceiling a first run pays and not what
      # an ordinary morning pays. Two runs do pay it in full: the first after a cold cache, and the one that
      # migrates the entries written before the push stamps existed. Every run after those pays only for the
      # repos pushed since it last looked -- ~319 a day, about a quarter of the set, on the 1,294 curated
      # repos where that was measured. The rule governs the rest of the 7,870 identically, but their push
      # rate has never been measured, so the figures above stay stated as the cold-run ceiling rather than
      # rescaled against a number nobody has.
      #
      # That REST figure is load-bearing, and it is new. `gh api graphql` exits 1 when a single repo in a
      # batch of twenty has been deleted, and `scripts/02_fetch.py` used to take it at its word and refetch
      # the nineteen survivors one at a time. At a 3.6% death rate that ruins two batches in five, which put
      # a full run at roughly 7,600 REST requests -- seven hours of this token's allowance for one build.
      # 02_fetch now reads the response body rather than the exit code. Undoing that puts these numbers back.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Does a red assertion stop the site updating? JFH-284 is that question and it is a policy decision
      # about the site rather than one about a test runner, so it is one word here rather than a shape
      # spread through the steps below. Either way the suite runs before the commit and either way a red
      # suite reddens the run -- what this changes is only whether the deploy happens first.
      #
      #   "false"  the site always ships and a red suite is a notification. Exposure to a regression is
      #            bounded at one day instead of the seven the Monday canary gives, which is the whole
      #            point of the ticket, and nothing about it can ever stop the site updating.
      #   "true"   nothing red publishes, at the cost of a site that stands still whenever an assertion
      #            fails for a reason unrelated to that day's data.
      #
      # It ships as "false" because that is the option that cannot make anything worse than the state
      # before it: today not one of this job's ~30 commits a month runs the suite at all. Turning it up
      # is this one word, and the two steps that read it are named for what they do in each mode.
      VERIFY_GATES_DEPLOY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip openpyxl pillow

      # `19_pages.py` reads CF_BEACON_TOKEN and treats an empty value as "no analytics", which is right for
      # a fork and for a local `python -m http.server` -- and wrong here. Declaring it in `env:` would set
      # it to "" on every run where the secret does not exist, so the job that publishes the real site would
      # be the one build guaranteed to ship a page that measures nothing. Written through $GITHUB_ENV only
      # when there is something to write, so "no override" and "override to off" stay different answers.
      - name: Honour a CF_BEACON_TOKEN override if one is set
        env:
          OVERRIDE: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "CF_BEACON_TOKEN=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using the CF_BEACON_TOKEN override."
          else
            echo "No override set; using the token committed in scripts/19_pages.py."
          fi

      # The same mechanism for the same reason, for the two search-engine tokens. Written through
      # $GITHUB_ENV only when there is something to write, because for both of them "" is not "unset":
      # `verification()` reads "" as "the site is not verified and emit no tag", and `indexnow_key()`
      # refuses "" outright. Declaring these in `env:` would set both to "" on every run where the
      # variable does not exist, which would turn the IndexNow submission into a hard failure on a fork.
      # Since JFH-215 the key file is written by this job too, so both workflows publish it.
      #
      # GOOGLE_SITE_VERIFICATION is unset today and the site is unverified until a human sets it -- only
      # the account owner can mint the token. Setting it here is the entire code change needed: the next
      # rebuild emits the meta tag in docs/index.html. INDEXNOW_KEY has a working committed default, and
      # an override only makes sense for a fork. It cannot be set in one workflow and not the other --
      # both read the same repository-scoped `vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY`, so there is one
      # setting and no way to disagree about its value. The hazard was temporal instead: the key file
      # used to be published weekly while submissions went out daily, so a rotation left up to six days
      # of 403s. JFH-215 closed that by running 20_landing.py here as well, which publishes the key file
      # in the same run that posts against it.
      - name: Honour the search-engine token overrides if they are set
        env:
          VERIFY: ${{ vars.GOOGLE_SITE_VERIFICATION || secrets.GOOGLE_SITE_VERIFICATION }}
          INDEXNOW: ${{ vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$VERIFY" ]; then
            echo "GOOGLE_SITE_VERIFICATION=$VERIFY" >> "$GITHUB_ENV"
            echo "Using the GOOGLE_SITE_VERIFICATION override; index.html will carry the meta tag."
          else
            echo "No GOOGLE_SITE_VERIFICATION set. The Search Console tag is omitted and the property is unverified -- see JFH-206."
          fi
          if [ -n "$INDEXNOW" ]; then
            echo "INDEXNOW_KEY=$INDEXNOW" >> "$GITHUB_ENV"
            echo "Using the INDEXNOW_KEY override. It must match weekly.yml's: both jobs run 20_landing.py, which writes the key file."
          else
            echo "No override set; using the IndexNow key committed in scripts/19_pages.py."
          fi

      # Rolling cache: a key nothing will ever hit, so every run saves a fresh entry, plus a restore-key
      # prefix so every run starts from the most recent one. The point is `cache/shots/` -- keeping it
      # warm is the difference between a five-minute job and one that would not finish inside the limit.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}
          restore-keys: atlas-cache-

      - name: Has any source list moved?
        id: watch
        run: python scripts/watch_sources.py

      - name: Decide whether to rebuild
        id: gate
        run: |
          # A cold cache is not a slow build here, it is a worse one. A large fraction of rows link to an
          # image this job never captures -- 686 of 1,294 when that was last measured, and the atlas has
          # sextupled since -- and rebuilding without the shot cache would silently swap all of them
          # for the generic repo card. So the absence of the cache is a stop, not a warning to ride past --
          # and not something `force` overrides, because forcing a rebuild is not the same as consenting to
          # a worse one. Dispatch the weekly workflow once; it captures the shots and fills the cache.
          if [ ! -f cache/shots_all.json ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No screenshot cache::Skipped the rebuild: cache/shots_all.json was not restored, so this build would have replaced every real screenshot with a generic repo card. Run the weekly workflow once to prime the cache."
            exit 0
          fi
          if [ "${{ steps.watch.outputs.changed }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No source list moved; a rebuild would produce the same bytes. Stopping."
          fi

      # Numeric order is the pipeline order. Absent here, deliberately: 05/06 and 15/15b (screenshots,
      # left to the weekly job), 07/08/09 and 16/18 (workbooks, and two stages that drive Excel through
      # COM and so cannot run on a Linux runner at all).
      - name: Fetch and classify
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          mkdir -p cache
          # The lists themselves, first: 01_parse and 10_parse_sources read them off disk and neither
          # fetches. This pulls only the ones whose head commit differs from the one already cached, so
          # on a day when one list moved it re-reads one list and not all thirty-nine. It also prints which
          # entries each list added or changed, and queues the changed ones for the weekly screenshot
          # job -- the step that probes SHAs above cannot, because it deliberately does not download.
          python scripts/pull_sources.py
          # --force empties cache/meta.json, which is the store 11_fetch_all also fills and the reason a
          # warm cache would otherwise never refresh a star count. Everything downstream re-derives.
          python scripts/01_parse.py
          python scripts/02_fetch.py --force
          # No --force on the three signal stages, and that is now a decision rather than the
          # oversight it used to be. All three queue on scripts/signals.py's rules -- re-query a
          # repo when its `pushedAt` has moved since its cache entry was written, when we looked so
          # soon after that push that its release CI could still have been uploading, and when we
          # have not looked at all in a month -- so they refresh themselves against the day's pushes
          # instead of freezing on first write: ~319 repos plus ~99 more from those two time terms,
          # about 35 requests and 35 GraphQL points, at the 1,294 repos where that was measured. Adding
          # a standing weekly --force would buy a full re-crawl -- 108 requests and points then, 656 at
          # the 7,870 these stages walk now -- to learn what these runs already know daily, and it
          # would leave the other six days stale.
          #
          # Those point figures are connection counts, not node counts, and this comment had them
          # wrong by ~6x until JFH-211: GitHub scores a call by the requests needed to fulfil each
          # connection in it, then divides by 100 with a minimum of one. Two connections per repo --
          # `releases(last: 4)` is one, the `releaseAssets(first: 40)` under each of those four is
          # four -- so a repo costs 5, a 12-repo batch costs 60, and 60/100 floored at 1 means every
          # batch any of these stages issues costs exactly one point. The request counts here were
          # always right; only the points were derived from nodes returned. Nothing has yet read a
          # `rateLimit { cost }` back from GitHub, which is the one-line way to replace this
          # derivation with a measurement.
          #
          # What the rules still cannot see is a binary attached to an *existing* release by hand,
          # more than six hours after any push. The 30-day ceiling bounds how long that can persist,
          # and a hand-dispatched --force is the lever for the rest.
          python scripts/03_releases.py
          python scripts/03b_actions.py
          python scripts/04_classify.py
          python scripts/10_parse_sources.py
          python scripts/11_fetch_all.py
          python scripts/13_signals_all.py
          python scripts/14_classify_all.py

      - name: Build the Markdown edition and the site
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # Dropped before the first generator writes anything, so the assertion below has something
          # earlier than the build to compare every tracked file against.
          touch "$RUNNER_TEMP/build-start"
          python scripts/17_markdown.py
          # Immediately after the generator that writes mega-list/, and before the four stages that do not
          # read it, so a broken page costs one step rather than a published commit. Every fault it looks
          # for renders on GitHub without an error and is wrong anyway -- a description containing a `|`
          # that split its row into three columns, a link to a page a taxonomy change deleted, a file over
          # the 512 KB at which GitHub serves a truncation notice in place of the table. None of those
          # would fail the build otherwise, and `git add mega-list` would commit every one of them. It was
          # written as part of the 39-list ingest and then wired into nothing, which is the same as not
          # having it: the pagination it backstops is exactly what the new lists' size made necessary.
          python scripts/check_markdown.py
          python scripts/19_pages.py
          # Also after 19_pages and never before, and for a blunter reason than the feeds below: that
          # stage rewrites data.json from scratch, and this one patches two columns and a `velocity`
          # block into the file it just wrote. Run first and its work is simply overwritten.
          #
          # Here as well as in weekly.yml even though the ledger it appends to is on a seven-day grid,
          # because `record()` is what enforces that grid -- it refuses a sample landing closer than
          # PERIOD_DAYS to the last one. So a daily invocation records about once a week and re-derives
          # the two deltas every day, which is what we want: the columns are rebuilt against the star
          # counts this run fetched rather than being left a week stale by the stage that wrote them.
          # Putting it only in weekly.yml would mean six days out of seven where 19_pages drops the
          # columns and nothing puts them back, and the Rising chip would vanish and reappear weekly.
          #
          # Nothing downstream reads `d7`, `d30` or `velocity`, so a failure here costs the Rising chip
          # and the gain figures and nothing else on the page.
          python scripts/25_velocity.py
          # After every stage that writes data.json -- 19_pages, which rewrites it, and 25_velocity, which
          # patches it -- because `docs/live.json` is a projection of three of its columns and has to be a
          # projection of the copy that ships, not of an earlier one. See weekly.yml for the ordering
          # argument at length; the short form is that `set -euo pipefail` makes it an invariant, because
          # this stage exits if the dataset is not there rather than writing an empty sidecar.
          #
          # Here *and* in weekly.yml, and this is the copy that matters. `22_detail.py`'s 1,294 pages fetch
          # this file for the star count, the last-push date and the snapshot they qualify, and that stage
          # is weekly-only (see the long note below) precisely because it emits no volatile byte. This file
          # is the volatile bytes, so it is rebuilt on the same cadence as `data.json` itself. Dropped from
          # this workflow, the detail pages would show star counts up to six days behind the index page's,
          # for the same repository, with nothing failing -- so the daily arm of that pairing is asserted
          # in tests/live_test.py rather than left to this comment.
          #
          # It costs history, which the note below spends fifty lines being careful about, so it is measured
          # here rather than asserted: 13 generations of the real 57,418-byte file with 60% of the star
          # counts perturbed each time, `git gc --aggressive --prune=now` after every commit, cost taken as
          # the slope across all 13 -- the same method, because a single delta jitters as repacking re-bases
          # the chains.
          #
          #   first commit                    22,528 B packed
          #   one regeneration                 5,221 B  (individual deltas 5,120..6,144 B)
          #   x365 (daily, what this is)        1.82 MB a year
          #
          # Sorting the keys by `nwo` instead of leaving them in data.json's star-descending row order is
          # half of that: the same 13 generations in rank order cost 10,499 B each and 3.65 MB a year, 2.0x
          # more, because two repositories swapping rank moves their entries rather than their numbers.
          # Sorted, a day of churn rewrites values in place. Worth knowing that the naive figure is 2x and
          # not 11x -- zlib deltas a permuted JSON object far better than the 57 KB the file weighs.
          python scripts/19c_live.py
          # Here as of JFH-215, in the same position weekly.yml already runs it in: after 19_pages and
          # 25_velocity, because it reads `docs/data.json` and nothing else, and before 24_pwa, because
          # it writes `docs/pages.css`, which that stage precaches and hashes. The note above 24_pwa is
          # what that second constraint costs if it is got wrong.
          #
          # 23_og stays weekly and this stage is safe without it. The og:image tag is emitted only for a
          # page whose card is already present in `docs/og/`, checked by filename, so a topic or crossing
          # that first appears today ships with no card rather than with a tag pointing at a file that is
          # not there, and picks one up on the next weekly run.
          python scripts/20_landing.py
          # After 19_pages and never before: that stage is what stamps the ledger and rewrites data.json,
          # and the feeds are a read of both. Run first, it would publish yesterday's arrivals.
          python scripts/21_feeds.py
          # Last, and its ordering against 20_landing above is the one in this job that would break
          # production without leaving a mark. The worker precaches `docs/index.html` and `docs/pages.css`
          # and hashes both into its own `VERSION`, so it has to see both in their final state. Run it
          # ahead of 20_landing on a day that changed the stylesheet and `sw.js` comes out byte-identical.
          #
          # Measured rather than reasoned, by perturbing one line of 20_landing's `CSS` constant and
          # running the pair both ways round against the committed `docs/`: pages.css moves from sha256
          # f3c7b93e to fc8d23b4 (7,474 -> 7,521 B) in both orders, while `VERSION` stays e1dbf6450dc9 --
          # the value committed today -- with 24_pwa first, and becomes 00d57d43d52c with it second. A
          # byte-identical `sw.js` is not a small mistake: the trigger for a worker update is a byte
          # change to `sw.js`, which is the one file that would not have changed, so there is no
          # self-healing path and every reader with the worker installed keeps the old shell
          # indefinitely (JFH-190/208).
          #
          # The stage does not take the ordering entirely on trust -- it exits with a message naming the
          # missing generator if either file is absent -- but "present" is not "current", and only the
          # order here makes it current.
          python scripts/24_pwa.py

      # `20_landing.py` runs in this job as of JFH-215, and the history it costs is the whole argument, so
      # the measurement stays here where the decision is. It rewrites 156 prerendered pages and every byte
      # is committed, because Pages serves this branch's `docs/` folder.
      #
      # This comment used to price that at ~600 KB of delta per run, ~224 MB of history a year daily
      # against ~32 MB weekly, and kept the stage out on that basis. Those numbers were wrong, all three
      # from the same mistake: they multiply the *whole* compressed page set by the number of runs, and
      # git does not store each run's pages independently -- it deltas them against the previous run's, so
      # the cost tracks changed bytes and not total bytes. 309 of the 312 facet blobs already in this
      # repository are stored as deltas.
      #
      # Measured, by committing 13 successive generations of the real 156 pages into a scratch repository
      # with 60% of the exact star counts perturbed each time, `git gc --aggressive --prune=now` after
      # every commit, and the per-generation cost taken as the slope across all 13 rather than any single
      # delta -- individual generations jitter from 11.7 KB to 85.8 KB as repacking re-bases the chains:
      #
      #   all 156 pages, first commit    595,458 B packed   (6.01 MB of HTML, so a ratio of 0.094)
      #   one regeneration                55,502 B packed   = 54.2 KB, not ~600 KB
      #   x365 (daily, what we now do)      19.3 MB a year  , not ~224 MB
      #   x52  (weekly, what we did)         2.8 MB a year  , not ~32 MB
      #
      # One figure looks like it contradicts this and does not: the two facet generations actually in this
      # repository's history cost 0.625 MB each, which would annualise to ~228 MB. Those two commits
      # straddle 7c54ab1, the JFH-180/181 template rewrite, where every page changed wholesale. A template
      # change costs ~0.6 MB; a day of star drift costs ~54 KB. Conflating them is the original error one
      # level down.
      #
      # So the cost argument for keeping this stage weekly did not hold: the trade is ~16 MB of history a
      # year against up to seven days of staleness on 156 pages that exist specifically for crawlers, and
      # that is worth paying. `<lastmod>` was honest either way -- it is stamped from the snapshot the
      # pages were built from, so the week-old pages never lied about their age -- but "does not lie about
      # being a week old" is a weaker property than "is not a week old". The permanent fix is still Pages
      # `build_type: workflow` (JFH-205), which stops versioning generated output at all and takes this
      # cost to zero; that is a separate change and this one did not wait for it.
      #
      # Two stages are still absent, and they are now the only ones: 22_detail and 23_og, weekly for a
      # stronger reason than 20_landing ever had. Both are built to be byte-stable against a day's star
      # drift -- 22_detail keeps every volatile number out of its HTML and fetches them client-side, and
      # 23_og floors its counts and skips any card whose content signature is unchanged -- so a daily run
      # of either would cost history and change nothing.

      # Every file this checks is one a generator above rewrites from scratch on every run, so any that
      # the build did not touch is a file the site will serve unchanged for ever. The commit step stages
      # `docs` and `mega-list` wholesale and git stages only differences, so an unwritten file produces
      # no diff, no churn, and no signal anywhere -- which is exactly how a page freezes without anyone
      # noticing. mtime against the marker is enough because a fresh checkout stamps every file with the
      # checkout time, which is earlier than the marker, so an untouched file cannot pass by accident,
      # and because all five generators write unconditionally -- none of them has a write-if-different
      # path that would make an unchanged file look skipped.
      #
      # Three outcomes and not one, because "nothing wrote this" has three causes with different remedies.
      # A stage missing from this workflow is a pipeline bug: fix the workflow. A page whose facet stopped
      # existing but is still on disk is the build working correctly and needs a human to `git rm` it. A
      # path a generator deleted outright needs nobody, because the commit step stages the removal. The
      # third is told apart by existence, before anything looks at a name or an mtime; the first two look
      # identical to mtime and are told apart by path.
      #
      # The prunable arm lists every prefix this job writes whose file *set* is
      # derived from the data: the four under `mega-list/` -- one page per topic, per target, per source
      # list, per platform, and 17_markdown emits `<platform>-inferred.md` only `if maybe:`, so even that
      # set moves -- and, since JFH-215 brought 20_landing into this job, `docs/topic/**` and
      # `docs/target/**`, which are one page per topic, per target and per crossing that has rows.
      # Everything else this job writes is a constant list. Pruning is left to a human on purpose: these
      # URLs are indexed, so removing one is a decision someone takes in the commit that changed the
      # taxonomy, not a side effect of a build.
      #
      # This holds only while every generator still writes at least one file outside those prefixes --
      # 17_markdown has mega-list/README.md, 19_pages has docs/index.html, 20_landing has
      # docs/sitemap.xml, 21_feeds has docs/feed.xml. A future stage whose entire output is facet pages
      # would warn where it should fail. Give any such stage one fixed-path file to write.
      #
      # The skipped arm is what the two remaining weekly-only stages cost: `docs/repo/**` and
      # `docs/sitemap-repos.xml` from `22_detail.py`, and `docs/og/**` from `23_og.py`, are not written by
      # this job, so they are skipped rather than reported. Either of those dropped from `weekly.yml` goes
      # unnoticed here and is caught there instead, within seven days rather than one. weekly.yml has no
      # such arm.
      #
      # `20_landing.py`'s five output prefixes used to be in that arm and are deliberately no longer:
      # the stage runs here now, so listing them as skipped would hide a genuine freeze in the one part
      # of the site that exists for crawlers. `docs/pages.css`, `docs/sitemap.xml`, `docs/robots.txt` and
      # the IndexNow key file now reach the strict arm, and the 156 facet pages the prunable one, which is
      # exactly how weekly.yml has always classified them -- the two jobs no longer disagree about what
      # any path under `docs/` means.
      #
      # `docs/repo/*` and not `docs/repo/*/*`, unlike weekly.yml: `docs/repo/index.html`, `detail.css` and
      # `detail.js` are fixed paths there because 22_detail writes them, and none of the three is written
      # here, so the broad glob is right in this file and wrong in that one.
      - name: Every tracked page was rewritten
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/frozen"
          : > "$RUNNER_TEMP/prunable"
          : > "$RUNNER_TEMP/skipped"
          : > "$RUNNER_TEMP/deleted"
          git ls-files docs mega-list | while IFS= read -r f; do
            case "$f" in
              docs/og/*|docs/repo/*|docs/sitemap-repos.xml)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/skipped"; continue ;;
            esac
            # Existence before mtime, and the arm is here for the same reason weekly.yml grew it in
            # 6d2216b -- see the long note there. `git ls-files` reads the *index*, so a file a generator
            # deliberately deleted from the working tree is still listed, and `-nt` against a path that
            # does not exist is false, so it would fall through the mtime skip and be sorted by name like
            # a file that is merely stale. No name pattern can tell those two apart.
            #
            # That arm was weekly-only until now because this job skipped `docs/*.txt`, which is the one
            # path a prune here can reach. Bringing 20_landing into this job removed that skip, so the
            # same rotation that used to cost weekly.yml its entire deploy would now cost this one its
            # daily deploy -- `20_landing.prune_keys` unlinks the key file from a rotated `INDEXNOW_KEY`,
            # and `20_landing.prune` unlinks facet pages whose facet stopped existing. Both are intended,
            # `git add docs mega-list` below stages the removal, and the repository self-heals in the same
            # run. Reported rather than warned about: on a rotation this fires exactly once.
            if [ ! -e "$f" ]; then printf '%s\n' "$f" >> "$RUNNER_TEMP/deleted"; continue; fi
            if [ "$f" -nt "$RUNNER_TEMP/build-start" ]; then continue; fi
            case "$f" in
              mega-list/topics/*|mega-list/targets/*|mega-list/lists/*|mega-list/platforms/*|docs/topic/*|docs/target/*)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/prunable" ;;
              *)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/frozen" ;;
            esac
          done
          np="$(wc -l < "$RUNNER_TEMP/prunable" | tr -d ' ')"
          nf="$(wc -l < "$RUNNER_TEMP/frozen" | tr -d ' ')"
          nd="$(wc -l < "$RUNNER_TEMP/deleted" | tr -d ' ')"
          if [ "$nd" -gt 0 ]; then
            echo "Tracked files this build deleted, whose removal the commit below carries:"
            sed 's/^/  /' "$RUNNER_TEMP/deleted"
          fi
          if [ "$np" -gt 0 ]; then
            echo "Facet pages that are tracked but no longer emitted:"
            sed 's/^/  /' "$RUNNER_TEMP/prunable"
            echo "::warning title=Orphaned facet page::${np} tracked facet page(s) were not written by this build. If a topic, target, source list or platform was dropped or renamed, this is correct and the fix is to \`git rm\` them in the commit that changed the taxonomy -- they are stale from now on, and their URLs are indexed. If no facet was dropped or renamed, this is not a prune: a generator is missing from this workflow and the build is wrong."
          fi
          if [ "$nf" -gt 0 ]; then
            echo "Tracked files that no generator wrote:"
            sed 's/^/  /' "$RUNNER_TEMP/frozen"
            echo "::error title=Generator missing from the build::${nf} tracked file(s) under docs/ or mega-list/ are committed but were not written. These have fixed paths, so no taxonomy change can explain them: the stage that writes them is missing from this workflow, and the published copy can never change again until it is put back."
            exit 1
          fi
          ns="$(wc -l < "$RUNNER_TEMP/skipped" | tr -d ' ')"
          nt="$(git ls-files docs mega-list | wc -l | tr -d ' ')"
          echo "Rewrote all $((nt - ns - nd)) of the tracked files this job is responsible for, deleted ${nd}; skipped ${ns} left to weekly.yml."

      # ---------------------------------------------------------------- verification, before publication
      #
      # The suite runs here, against the tree this job just built and is about to publish, and that
      # placement is the entire content of JFH-284. `tests.yml` next door runs the same thirteen harnesses
      # on pull requests, on pushes to `latest_branch`, and as a Monday canary -- but this job pushes with
      # `secrets.GITHUB_TOKEN` through `actions/checkout`'s persisted credentials, and GitHub deliberately
      # starts no workflow runs for pushes made with that token. So not one of this job's ~30 commits a
      # month has ever triggered it, and those commits rewrite `data.json`, `index.html`, `sw.js` and 156
      # facet pages -- all four of which the suite asserts on. Pages serves `latest_branch` verbatim, so
      # landing is publishing, and the canary was catching a regression up to seven days after readers did.
      #
      # Node is set up here rather than at the top of the job because nothing above needs it and a skipped
      # build should not pay for it. Version 22, matching `tests.yml` exactly: the point of running the
      # suite here is that green there and green here mean the same thing, and a different major would make
      # that an assumption rather than a fact.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "22"

      # Hashed before the suite runs, so the step after it can prove the suite did not write into what is
      # about to be committed. The suite is built not to -- every harness writes into a `mkdtemp` or into
      # gitignored `build-tmp/`, and `live_test.py:298` carries an assertion whose stated purpose is that
      # `--out` never points at the real `docs/` -- but "built not to" and "did not" are different claims,
      # and only one of them is checked. It matters more here than anywhere else the suite runs: `git add
      # docs mega-list state` below would stage a harness's scratch output and publish it, and the suite
      # regenerates 1,294 detail pages four times.
      # The listing itself rather than a hash of it, for two reasons. It is the diagnostic -- the step below
      # can print the difference instead of reporting that two checksums disagree -- and it cannot fail
      # open. `git status | sha256sum` masks git's exit code through the pipe, and GitHub's default shell is
      # `bash -e` without `pipefail`, so a broken git would have written the hash of no output here, the hash
      # of no output there, and the comparison would have passed by agreeing about nothing.
      - name: Photograph the publish set before the suite touches anything
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          git status --porcelain -- docs mega-list state > "$RUNNER_TEMP/publish-set-before"
          echo "$(wc -l < "$RUNNER_TEMP/publish-set-before" | tr -d ' ') path(s) under docs/, mega-list/ and state/ stand changed by this build"

      # `continue-on-error` so that the *decision* about a red suite lives in one place -- the step below,
      # reading VERIFY_GATES_DEPLOY -- rather than being implied by where this one happens to sit. This
      # step's job is to produce an answer and record it, not to act on it.
      #
      # The exit code is captured and interpreted for the same reason `tests.yml` does it: `run.mjs` exits
      # 1 for an assertion failure or a harness that went quiet, and 2 when it cannot find Chromium or
      # Python and refused to start. The second is a fact about the runner rather than about the site being
      # published, and conflating them would send somebody to read a data diff over a missing browser.
      - name: Verify the site this build is about to publish
        id: verify
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          # The two flags `tests.yml` and `lighthouse.yml` both pass, for the reason both state: a container
          # has no user namespace to sandbox into and a 64 MB `/dev/shm`, and Chrome crashes on both rather
          # than degrading. `lib/browser.mjs` appends these to every launch.
          AAA_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          set -uo pipefail
          status=0
          node tests/run.mjs || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) echo "the suite is green against the tree this run is about to publish" ;;
            1) echo "::error title=The suite is red on today's build::An assertion failed, or a harness went quiet -- printed no tally, asserted nothing, or made fewer assertions than its floor in run.mjs's HARNESSES table. The per-harness summary above says which. This is a statement about the pages this run generated, not about the runner." ;;
            2) echo "::error title=The suite could not run::run.mjs exits 2 when it cannot find Chromium or Python 3, before any harness starts, and prints the env vars, cache directories and PATH it searched. Nothing about today's build failed here -- the runner image or the setup steps above have stopped providing something the suite needs." ;;
            *) echo "::error::run.mjs exited ${status}, which it has no documented meaning for. Read its output above." ;;
          esac
          exit 0

      # Hard-failing whatever VERIFY_GATES_DEPLOY says, because this is not the policy question. A harness
      # that wrote into `docs/`, `mega-list/` or `state/` has put its scratch output in the way of the
      # commit below, and publishing it is not a trade anyone chose.
      # Its own step rather than the tail of the one above, because the photograph has to be taken by
      # something that fails when it cannot take it. The step above is `continue-on-error` by design, so a
      # git failure inside it would have been swallowed and read here as "nothing changed" -- and an empty
      # listing is a legitimate answer (the commit step below has an `exit 0` for the day the lists moved
      # but nothing they changed reaches these surfaces), so emptiness cannot be the signal for trouble.
      # `diff` decides instead, and a missing before-photograph makes it fail rather than pass.
      - name: Refuse to publish anything the suite itself wrote
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          git status --porcelain -- docs mega-list state > "$RUNNER_TEMP/publish-set-after"
          if ! diff -u "$RUNNER_TEMP/publish-set-before" "$RUNNER_TEMP/publish-set-after"; then
            echo "::error title=The suite wrote into the publish set::A harness modified docs/, mega-list/ or state/ while running, and the difference is printed above. Every harness is supposed to write only into a mkdtemp or into gitignored build-tmp/ -- live_test.py carries an assertion whose stated purpose is that --out never points at the real docs/ -- so one of them has grown an output path that reaches the repository. The commit step below would stage it and Pages would serve it."
            exit 1
          fi
          echo "the suite wrote nothing into docs/, mega-list/ or state/"

      # The policy question, in the one place it is asked. On "true" this is the gate and nothing red gets
      # as far as the commit; on "false" it is a no-op here and the same red result fails the job at the
      # very end instead, after the site has shipped.
      - name: Decide whether a red suite stops this deploy
        if: steps.gate.outputs.go == 'true'
        env:
          STATUS: ${{ steps.verify.outputs.status }}
        run: |
          set -euo pipefail
          if [ "${STATUS}" = "0" ]; then exit 0; fi
          if [ "${VERIFY_GATES_DEPLOY}" = "true" ]; then
            echo "::error title=Deploy blocked by a red suite::VERIFY_GATES_DEPLOY is true, so nothing is recorded, committed or published. The site keeps serving yesterday's build, which is stale rather than wrong. Nothing about the source lists was lost: the SHAs are recorded in the step after this one, so tomorrow's run rebuilds today's entries too."
            exit 1
          fi
          echo "::warning title=Publishing over a red suite::VERIFY_GATES_DEPLOY is false, so today's build ships and this run will end red to say so. The regression is live from now; it is bounded at one day rather than the seven the Monday canary gives."

      # Only now, and only because everything above succeeded. Recording the SHAs earlier would mean a
      # build that failed halfway was never retried: the next run would compare against the commit it
      # died on, conclude there was nothing to do, and the new entries would be lost for good.
      - name: Record the source commits as built
        if: steps.gate.outputs.go == 'true'
        run: python scripts/watch_sources.py --update

      - name: Commit and push
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mega-list state
          if git diff --cached --quiet; then
            echo "The lists moved but nothing they changed reaches these three surfaces. Nothing to commit."
            exit 0
          fi
          # The one moment in the whole job that knows exactly which pages changed, and it is this narrow:
          # the index differs from HEAD, so `--cached` is the delta about to be published, and after the
          # commit below it is empty. Recorded to a file rather than an output because the weekly run's
          # version of this list is ~1,450 lines, which is past what a step output should carry.
          #
          # `--no-renames` on purpose: a rename is two facts an engine wants -- the old URL is gone and the
          # new one exists -- and a rename record would hide the first. Reaching this line at all means
          # something is being committed, which is why the IndexNow step treats a missing file as "nothing
          # changed" rather than as an error: that is the `exit 0` above, and it is not a failure.
          git diff --cached --name-status --no-renames -- docs > "$RUNNER_TEMP/changed-docs.txt"
          summary="$(python scripts/newness.py | sed -n '2p')"
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)" -m "${summary}"
          # Rebase rather than force-push: a commit someone pushed by hand while this ran should survive.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # After the push, and that ordering is the whole design. IndexNow tells an engine to come and fetch a
      # URL, so the URL has to be live first -- submitting before the push would point Bing at the previous
      # deployment. It cannot fail the job either: the site is published by the time this runs, and a search
      # engine being down, rate-limiting, or not yet having fetched the key file is not a build error.
      # `26_indexnow.py` turns any non-2xx into a workflow warning and exits 0; it exits non-zero only for a
      # fault on this side, which is a malformed key or a URL that is not on this site.
      #
      # Gated like every step above it. Without the `if:` this would run on a skipped build, where nothing
      # was committed and `changed-docs.txt` does not exist -- harmless today, because the script treats an
      # absent file as "nothing changed", but a step that only works by accident is not gated.
      #
      # JFH-215 raised what this submits from one URL a day to up to 157, and that is the point of the
      # change rather than a side effect of it: the 156 facet pages are the ones that exist for crawlers,
      # and until now they were told about weekly. The ceiling is not close. `url_for()` maps only
      # `index.html` paths to URLs, so the stylesheet, the sitemaps, the feeds, the key file and the icons
      # this job also rewrites map to nothing, which bounds a daily submission at the root plus 156 facet
      # pages; `26_indexnow.py`'s `BATCH` is 10,000, so that is one request using 1.6% of the batch. The
      # weekly run's list is the larger one, because it carries a detail page per repo: ~1,452 when this
      # was written, on the order of 8,000 at the atlas's size now. Still one batch, but no longer with
      # much room -- this is the figure that decides whether `BATCH` ever has to mean something.
      - name: Tell IndexNow which URLs changed
        if: steps.gate.outputs.go == 'true'
        run: python scripts/26_indexnow.py --changed "$RUNNER_TEMP/changed-docs.txt"

      - name: What is new
        if: steps.gate.outputs.go == 'true'
        run: python scripts/newness.py

      # Last, and only reachable in the non-gating mode -- on "true" the decision step above already failed
      # the job and nothing after it ran. This is what makes "report without blocking" a report rather than
      # a shrug: the deploy is done, and the run still ends red, so it appears red in the Actions list and
      # GitHub emails the repository owner. Without this step a red suite would be a `continue-on-error`
      # annotation on a green run, which is the failure mode `tests.yml`'s header keeps returning to -- a
      # check that quietly did not stop anything looks exactly like a check that passed.
      #
      # `always()` so that this is still asked when a later step failed for its own reasons. The IndexNow
      # step cannot fail the job by design, but it should not be able to hide this either.
      - name: End red if the suite was red
        if: always() && steps.gate.outputs.go == 'true' && steps.verify.outputs.status != '0'
        run: |
          echo "::error title=Published, and red::The site was published and the verification suite was not green on it (run.mjs exited ${{ steps.verify.outputs.status }}). Read the suite's own step above for which harness and which assertion. To stop a red suite publishing at all, set VERIFY_GATES_DEPLOY to \"true\" at the top of this file."
          exit 1
