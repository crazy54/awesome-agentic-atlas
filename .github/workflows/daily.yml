# Daily: notice what the 39 source lists added, and republish the site and the Markdown edition.
#
# What this job does NOT do is capture screenshots or build the workbooks. Screenshots are the only
# genuinely expensive stage -- 3,462 headless renders on a cold cache when the atlas was 1,294 repos,
# so upward of 20,000 at the 7,980 it holds now -- and both the site and the
# Markdown fall back to GitHub's Open Graph card for any repo without one, which two thirds of rows
# already use. So a brand-new project shows its card here within a day and gets a real screenshot when
# `weekly.yml` next runs. Metadata is not deferred that way: stars and last-push are refetched in full
# every run, because a snapshot date that advanced while the numbers underneath it stood still would be
# a lie told daily.
#
# Pages needs no deploy step. This repository serves Pages from the branch's `docs/` folder, so the
# commit at the end of this job *is* the deployment -- GitHub's own pages-build-deployment run picks it
# up. Nothing here has to be told the site's URL.
name: Daily — site & Markdown

on:
  schedule:
    # 11:12 UTC. Actions cron is UTC only and never shifts for daylight saving, so this is 07:12 in New
    # York in summer and 06:12 in winter. Twelve past the hour rather than on it: the top of every hour
    # is when every cron on GitHub fires at once and scheduled runs get queued behind it.
    - cron: "12 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no source list has moved
        type: boolean
        default: false

# The build commits docs/, mega-list/ and state/ back to this branch. That push is what redeploys Pages.
permissions:
  contents: write

# One atlas build at a time. The weekly workbook job shares this group on purpose: both write `cache/`
# and both push to the same branch, so two at once would race on the first-seen ledger and then one of
# them would fail to push. `cancel-in-progress: false` because a half-finished build that gets killed
# has already recorded nothing -- letting it finish is cheaper than the retry.
concurrency:
  group: atlas-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 90 was set when the atlas was 1,294 repos and it no longer fits. The network stages alone measure out
    # at around eighty minutes at the 7,870 distinct repos the source lists now resolve to -- see the token
    # note below for the breakdown -- before pip, the cache restore, the generators and the push. A run cut
    # off at the timeout is the quietest possible failure: it commits nothing and records nothing, so the
    # published site simply stops moving and there is no diff anywhere that says why. 180 is about twice the
    # projection, which is the room the atlas needs to double again before this number is what breaks, and
    # still half of weekly.yml's.
    timeout-minutes: 180
    env:
      # Every fetch stage shells out to `gh`, which reads this. The Actions token is enough -- the pipeline
      # only ever reads public repositories -- but the limit it grants, 1,000 requests per hour per repo, is
      # a fifth of what a personal token gets, so what a run spends is worth knowing. Nothing here probes
      # repos one at a time: all five metadata and signal stages batch theirs into a single GraphQL query,
      # twelve to twenty-five at a time, and a batch costs one point however many repos are in it. So the
      # 7,870 come to about 395 points for stars and READMEs and about 660 for the release and Actions
      # signals, plus 32 for the 199 curated entries: call it 1,100 batches, which is the figure the retry
      # ceiling in `02_fetch.py` is sized against -- at one attempt each, a per-batch failure rate as low as
      # a tenth of a percent makes a red build more likely than not. REST is the expensive road and it is
      # taken for two things only: a repo whose README is not
      # literally `README.md` at HEAD, which is 2.8% of them at two requests each, and a repo GitHub cannot
      # resolve at all, which is 3.6% at one 404 each. Call a full cold run 1,200 GraphQL points and 800
      # REST requests.
      #
      # That REST figure is load-bearing, and it is new. `gh api graphql` exits 1 when a single repo in a
      # batch of twenty has been deleted, and `scripts/02_fetch.py` used to take it at its word and refetch
      # the nineteen survivors one at a time. At a 3.6% death rate that ruins two batches in five, which put
      # a full run at roughly 7,600 REST requests -- seven hours of this token's allowance for one build.
      # 02_fetch now reads the response body rather than the exit code. Undoing that puts these numbers back.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip openpyxl pillow

      # `19_pages.py` reads CF_BEACON_TOKEN and treats an empty value as "no analytics", which is right for
      # a fork and for a local `python -m http.server` -- and wrong here. Declaring it in `env:` would set
      # it to "" on every run where the secret does not exist, so the job that publishes the real site would
      # be the one build guaranteed to ship a page that measures nothing. Written through $GITHUB_ENV only
      # when there is something to write, so "no override" and "override to off" stay different answers.
      - name: Honour a CF_BEACON_TOKEN override if one is set
        env:
          OVERRIDE: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "CF_BEACON_TOKEN=$OVERRIDE" >> "$GITHUB_ENV"
            echo "Using the CF_BEACON_TOKEN override."
          else
            echo "No override set; using the token committed in scripts/19_pages.py."
          fi

      # Rolling cache: a key nothing will ever hit, so every run saves a fresh entry, plus a restore-key
      # prefix so every run starts from the most recent one. The point is `cache/shots/` -- keeping it
      # warm is the difference between a five-minute job and one that would not finish inside the limit.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}
          restore-keys: atlas-cache-

      - name: Has any source list moved?
        id: watch
        run: python scripts/watch_sources.py

      - name: Decide whether to rebuild
        id: gate
        run: |
          # A cold cache is not a slow build here, it is a worse one. A large fraction of rows link to an
          # image this job never captures -- 686 of 1,294 when that was last measured, and the atlas has
          # sextupled since -- and rebuilding without the shot cache would silently swap all of them
          # for the generic repo card. So the absence of the cache is a stop, not a warning to ride past --
          # and not something `force` overrides, because forcing a rebuild is not the same as consenting to
          # a worse one. Dispatch the weekly workflow once; it captures the shots and fills the cache.
          if [ ! -f cache/shots_all.json ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No screenshot cache::Skipped the rebuild: cache/shots_all.json was not restored, so this build would have replaced every real screenshot with a generic repo card. Run the weekly workflow once to prime the cache."
            exit 0
          fi
          if [ "${{ steps.watch.outputs.changed }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No source list moved; a rebuild would produce the same bytes. Stopping."
          fi

      # Numeric order is the pipeline order. Absent here, deliberately: 05/06 and 15/15b (screenshots,
      # left to the weekly job), 07/08/09 and 16/18 (workbooks, and two stages that drive Excel through
      # COM and so cannot run on a Linux runner at all).
      - name: Fetch and classify
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          mkdir -p cache
          # The lists themselves, first: 01_parse and 10_parse_sources read them off disk and neither
          # fetches. This pulls only the ones whose head commit differs from the one already cached, so
          # on a day when one list moved it re-reads one list and not all thirty-nine. It also prints which
          # entries each list added or changed, and queues the changed ones for the weekly screenshot
          # job -- the step that probes SHAs above cannot, because it deliberately does not download.
          python scripts/pull_sources.py
          # --force empties cache/meta.json, which is the store 11_fetch_all also fills and the reason a
          # warm cache would otherwise never refresh a star count. Everything downstream re-derives.
          python scripts/01_parse.py
          python scripts/02_fetch.py --force
          python scripts/03_releases.py
          python scripts/03b_actions.py
          python scripts/04_classify.py
          python scripts/10_parse_sources.py
          python scripts/11_fetch_all.py
          python scripts/13_signals_all.py
          python scripts/14_classify_all.py

      - name: Build the Markdown edition and the site
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # Dropped before the first generator writes anything, so the assertion below has something
          # earlier than the build to compare every tracked file against.
          touch "$RUNNER_TEMP/build-start"
          python scripts/17_markdown.py
          # Immediately after the generator that writes mega-list/, and before the two stages that do not
          # read it, so a broken page costs one step rather than a published commit. Every fault it looks
          # for renders on GitHub without an error and is wrong anyway -- a description containing a `|`
          # that split its row into three columns, a link to a page a taxonomy change deleted, a file over
          # the 512 KB at which GitHub serves a truncation notice in place of the table. None of those
          # would fail the build otherwise, and `git add mega-list` would commit every one of them. It was
          # written as part of the 38-list ingest and then wired into nothing, which is the same as not
          # having it: the pagination it backstops is exactly what the new lists' size made necessary.
          python scripts/check_markdown.py
          python scripts/19_pages.py
          # After 19_pages and never before: that stage is what stamps the ledger and rewrites data.json,
          # and the feeds are a read of both. Run first, it would publish yesterday's arrivals.
          python scripts/21_feeds.py

      # `20_landing.py` is deliberately absent, and it is the one stage whose absence here is a decision
      # rather than an oversight. It rewrites 156 prerendered pages, 143 of which change on any run where
      # a star count moved -- about 600 KB of compressed delta. Every byte is committed, because Pages
      # serves this branch's `docs/` folder, so daily would add ~224 MB of history a year against a
      # repository whose entire packed history is 111 MB today. Weekly is ~32 MB. The pages exist for
      # crawlers, which recrawl on a multi-day cadence and will not notice the difference, and
      # `<lastmod>` stays honest either way because it is stamped from the snapshot the pages were built
      # from. So: bounded 7-day staleness on a crawler surface, in exchange for not doubling the clone
      # size every year. The permanent fix is Pages `build_type: workflow`, which stops versioning
      # generated output at all -- a separate change, not this one.

      # Every file this checks is one a generator above rewrites from scratch on every run, so any that
      # the build did not touch is a file the site will serve unchanged for ever. The commit step stages
      # `docs` and `mega-list` wholesale and git stages only differences, so an unwritten file produces
      # no diff, no churn, and no signal anywhere -- which is exactly how a page freezes without anyone
      # noticing. mtime against the marker is enough because a fresh checkout stamps every file with the
      # checkout time, which is earlier than the marker, so an untouched file cannot pass by accident,
      # and because all four generators write unconditionally -- none of them has a write-if-different
      # path that would make an unchanged file look skipped.
      #
      # Two outcomes, not one, because "nothing wrote this" has two causes with opposite remedies. A
      # stage missing from this workflow is a pipeline bug: fix the workflow. A page whose facet stopped
      # existing is the build working correctly: delete the page. Both look identical to mtime, so they
      # are told apart by path. The four `mega-list/` prefixes below are the only ones this job writes
      # whose file *set* is derived from the data -- one page per topic, per target, per source list, per
      # platform, and 17_markdown emits `<platform>-inferred.md` only `if maybe:`, so even that set
      # moves. Everything else it writes is a constant list. Pruning is left to a human on purpose: these URLs are indexed, so removing one is
      # a decision someone takes in the commit that changed the taxonomy, not a side effect of a build.
      #
      # This holds only while every generator still writes at least one file outside those prefixes --
      # 17_markdown has mega-list/README.md, 19_pages has docs/index.html, 20_landing has
      # docs/sitemap.xml, 21_feeds has docs/feed.xml. A future stage whose entire output is facet pages
      # would warn where it should fail. Give any such stage one fixed-path file to write.
      #
      # The third arm is what `20_landing.py` running weekly-only costs: its five output paths are not
      # written by this job, so they are skipped rather than reported. That is the whole price of the
      # history decision above -- a landing generator dropped from `weekly.yml` goes unnoticed here and
      # is caught there instead, within seven days rather than one. weekly.yml has no such arm.
      - name: Every tracked page was rewritten
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/frozen"
          : > "$RUNNER_TEMP/prunable"
          : > "$RUNNER_TEMP/skipped"
          git ls-files docs mega-list | while IFS= read -r f; do
            case "$f" in
              docs/topic/*|docs/target/*|docs/pages.css|docs/sitemap.xml|docs/robots.txt)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/skipped"; continue ;;
            esac
            if [ "$f" -nt "$RUNNER_TEMP/build-start" ]; then continue; fi
            case "$f" in
              mega-list/topics/*|mega-list/targets/*|mega-list/lists/*|mega-list/platforms/*)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/prunable" ;;
              *)
                printf '%s\n' "$f" >> "$RUNNER_TEMP/frozen" ;;
            esac
          done
          np="$(wc -l < "$RUNNER_TEMP/prunable" | tr -d ' ')"
          nf="$(wc -l < "$RUNNER_TEMP/frozen" | tr -d ' ')"
          if [ "$np" -gt 0 ]; then
            echo "Facet pages that are tracked but no longer emitted:"
            sed 's/^/  /' "$RUNNER_TEMP/prunable"
            echo "::warning title=Orphaned facet page::${np} tracked facet page(s) were not written by this build. If a topic, target, source list or platform was dropped or renamed, this is correct and the fix is to \`git rm\` them in the commit that changed the taxonomy -- they are stale from now on, and their URLs are indexed. If no facet was dropped or renamed, this is not a prune: a generator is missing from this workflow and the build is wrong."
          fi
          if [ "$nf" -gt 0 ]; then
            echo "Tracked files that no generator wrote:"
            sed 's/^/  /' "$RUNNER_TEMP/frozen"
            echo "::error title=Generator missing from the build::${nf} tracked file(s) under docs/ or mega-list/ are committed but were not written. These have fixed paths, so no taxonomy change can explain them: the stage that writes them is missing from this workflow, and the published copy can never change again until it is put back."
            exit 1
          fi
          ns="$(wc -l < "$RUNNER_TEMP/skipped" | tr -d ' ')"
          nt="$(git ls-files docs mega-list | wc -l | tr -d ' ')"
          echo "Rewrote all $((nt - ns)) of the tracked files this job is responsible for; skipped ${ns} left to weekly.yml."

      # Only now, and only because everything above succeeded. Recording the SHAs earlier would mean a
      # build that failed halfway was never retried: the next run would compare against the commit it
      # died on, conclude there was nothing to do, and the new entries would be lost for good.
      - name: Record the source commits as built
        if: steps.gate.outputs.go == 'true'
        run: python scripts/watch_sources.py --update

      - name: Commit and push
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mega-list state
          if git diff --cached --quiet; then
            echo "The lists moved but nothing they changed reaches these three surfaces. Nothing to commit."
            exit 0
          fi
          summary="$(python scripts/newness.py | sed -n '2p')"
          git commit -m "Daily refresh $(date -u +%Y-%m-%d)" -m "${summary}"
          # Rebase rather than force-push: a commit someone pushed by hand while this ran should survive.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: What is new
        if: steps.gate.outputs.go == 'true'
        run: python scripts/newness.py
